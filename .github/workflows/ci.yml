name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Core, web and database tests. The database tests start a throwaway Postgres
      # from the binaries preinstalled on GitHub's Ubuntu runners.
      - run: npm test
      - run: npm run build
